[package]
name = "rtn-mq"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Embedded authenticated direct publish/subscribe over Iroh"

[dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
iroh = "=1.0.3"
libc = "=0.2.189"
minicbor = { version = "=2.3.0", features = ["std"] }
rand = "=0.10.2"
rtrb = "=0.4.0"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[dev-dependencies]
iroh-relay = { version = "=1.1.0", features = ["server"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
